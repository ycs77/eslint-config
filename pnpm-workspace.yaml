ignoreWorkspaceRootCheck: true
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade

update:
  ignoreDeps:
    - typescript@7

strictPeerDependencies: false
shamefullyHoist: true
shellEmulator: true

allowBuilds:
  esbuild: true

catalogs:
  dev:
    '@eslint/config-inspector': ^3.5.0
    '@types/node': ^26.6.6
    actionspack: ^0.1.5
    bumpp: ^12.3.0
    eslint-plugin-astro: ^3.2.1
    eslint-plugin-erasable-syntax-only: ^0.7.2
    eslint-plugin-format: ^2.0.1
    eslint-plugin-vue: ^10.12.1
    eslint-plugin-vuejs-accessibility: ^2.6.3
    eslint-typegen: ^2.3.2
    tinyexec: ^1.3.1
    tinyglobby: ^0.2.17
    tsdown: ^0.23.5
    tsdown-stale-guard: ^0.1.3
    tsnapi: ^1.6.1
    tsx: ^4.23.15
    typescript: ^6.0.3
    vitest: ^5.1.0
    vue: ^3.5.45
  peer:
    eslint: ^10.15.0
    eslint-plugin-astro-explicit-wrapper: ^1.0.5
  prod:
    '@antfu/eslint-config': ~10.0.0
    '@typescript-eslint/parser': ^8.72.2
    eslint-flat-config-utils: ^3.2.0
    eslint-plugin-antfu: ^3.3.1
    local-pkg: ^2.0.0
